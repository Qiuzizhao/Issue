<!doctype html>
<html lang="zh-CN">
<head>

<body>
  <main class="wrap" id="apps">
    <h1>应用下载</h1>

    <article class="app-card" data-app="booky" aria-labelledby="booky-title">
      <img class="app-icon" src="/assets/booky-icon.png" alt="" width="64" height="64">
      <div class="app-info"><h2 id="booky-title">Booky <span class="platform">Android</span></h2><p class="app-description">记录收支、管理预算，查看报表与 AI 分析。</p><p data-role="version">正在获取版本…</p></div>
      <a data-role="download" class="download-button disabled" aria-disabled="true"><span data-role="label">加载中…</span><span aria-hidden="true">↓</span></a>
      <div data-role="status" class="status" role="status" aria-live="polite" hidden></div>

</html>
