server {
 listen 80;
 server_name updates.qiuzizhao.com;
 location ^~ /.well-known/acme-challenge/ { root /var/www/app-updates; try_files $uri =404; }
 location / { return 301 https://$host$request_uri; }
}
server {
 listen 443 ssl;
 server_name updates.qiuzizhao.com;
 ssl_certificate /etc/letsencrypt/live/updates.qiuzizhao.com/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/updates.qiuzizhao.com/privkey.pem;
 include /etc/letsencrypt/options-ssl-nginx.conf;
 ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
 include /etc/nginx/snippets/app-updates-locations.conf;
}
