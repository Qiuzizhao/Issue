server {
 listen 80;
 server_name updates.qiuzizhao.com;
 # Cloudflare Flexible sends HTTPS visitor requests to this HTTP listener.
 set $updates_redirect 0;
 if ($http_x_forwarded_proto != "https") { set $updates_redirect 1; }
 if ($uri ~ "^/\.well-known/acme-challenge/") { set $updates_redirect 0; }
 if ($updates_redirect = 1) { return 301 https://$host$request_uri; }
 include /etc/nginx/snippets/app-updates-locations.conf;
}
server {
 listen 443 ssl;
 server_name updates.qiuzizhao.com;
 ssl_certificate /etc/letsencrypt/live/updates.qiuzizhao.com/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/updates.qiuzizhao.com/privkey.pem;
 include /etc/letsencrypt/options-ssl-nginx.conf;
 ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
 include /etc/nginx/snippets/app-updates-locations.conf;
}
