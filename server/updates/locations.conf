root /var/www/app-updates;
client_max_body_size 1m;
location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
location = / {
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
    try_files /index.html =404;
}
location = /health.json {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 200 '{"service":"app-updates","apps":["issue","booky","notes"]}';
}
location /assets/ {
    add_header Cache-Control "public, max-age=3600";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
    limit_except GET { deny all; }
}
location ~ ^/[a-z0-9-]+/latest\.json$ {
    default_type application/json;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header CDN-Cache-Control "no-store" always;
    add_header Cloudflare-CDN-Cache-Control "no-store" always;
    try_files $uri =404;
    limit_except GET { deny all; }
}
location ~ ^/[a-z0-9-]+/releases/[A-Za-z0-9._-]+\.apk$ {
    types { application/vnd.android.package-archive apk; }
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
    limit_except GET { deny all; }
}
location / { return 404; }
